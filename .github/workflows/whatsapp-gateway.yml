# Temporary WhatsApp gateway on a GitHub runner.
#
# This is a stopgap for testing while there is no server. It runs the same WAHA
# gateway the real deployment runs, opens a tunnel to it, tells the platform
# where to find it, and hands over to a fresh run before GitHub's six-hour job
# limit ends it.
#
# Read deploy/github/README.md before switching it on. It explains the limits,
# what breaks, and how to turn it off.
#
# The WhatsApp session is never stored in this repository. It is encrypted on
# the runner with a passphrase held as a repository secret, then kept in the
# platform's own database. Nothing that can read the database can open it.

name: WhatsApp gateway (temporary)

on:
  schedule:
    # Every fifteen minutes. The concurrency guard below means only one run is
    # ever live, so this is really "start again as soon as the last one ends".
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: whatsapp-gateway
  cancel-in-progress: false

permissions:
  contents: read

env:
  SESSION_ARCHIVE: waha-sessions.tar.gz.enc
  SITE_URL: ${{ vars.SITE_URL || 'https://goldoak.vercel.app' }}

jobs:
  gateway:
    runs-on: ubuntu-latest
    # Just under GitHub's six-hour ceiling, so the shutdown steps always run.
    timeout-minutes: 350

    steps:
      - name: Check the settings are present
        env:
          WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }}
          SESSION_PASSPHRASE: ${{ secrets.SESSION_PASSPHRASE }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          missing=""
          for v in WAHA_API_KEY SESSION_PASSPHRASE ADMIN_TOKEN; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "See deploy/github/README.md for what each one is."
            exit 1
          fi
          echo "All required secrets are set. Platform: $SITE_URL"

      - uses: actions/checkout@v4

      - name: Restore the WhatsApp session
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SESSION_PASSPHRASE: ${{ secrets.SESSION_PASSPHRASE }}
        run: |
          mkdir -p sessions media
          code=$(curl -s -o saved.json -w '%{http_code}' \
            -H "x-admin-token: $ADMIN_TOKEN" \
            "$SITE_URL/api/admin/gateway/session" || echo 000)
          if [ "$code" = "200" ]; then
            jq -r '.payload' saved.json | base64 -d > "$SESSION_ARCHIVE"
            if openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SESSION_PASSPHRASE \
                 -in "$SESSION_ARCHIVE" | tar -xz -C sessions; then
              echo "Session restored; no QR needed."
            else
              echo '::warning::The saved session would not decrypt. Check SESSION_PASSPHRASE. A new QR will be needed.'
            fi
          else
            echo "No saved session (HTTP $code). The first pairing will need a QR."
          fi
          rm -f saved.json "$SESSION_ARCHIVE"
          # WAHA runs as uid 1000 inside the container.
          sudo chown -R 1000:1000 sessions media

      - name: Start the gateway
        env:
          WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }}
          WAHA_SESSION: ${{ secrets.WAHA_SESSION }}
        run: |
          docker run -d --name waha \
            -p 127.0.0.1:3000:3000 \
            -e TZ=Africa/Nairobi \
            -e WHATSAPP_DEFAULT_ENGINE=NOWEB \
            -e WHATSAPP_API_KEY="$WAHA_API_KEY" \
            -e WHATSAPP_RESTART_ALL_SESSIONS=True \
            -e WHATSAPP_START_SESSION="${WAHA_SESSION:-default}" \
            -e WHATSAPP_STORE_ENABLED=False \
            -e WHATSAPP_SWAGGER_ENABLED=False \
            -v "$PWD/sessions:/app/.sessions" \
            -v "$PWD/media:/app/.media" \
            devlikeapro/waha:noweb

          for i in $(seq 1 60); do
            curl -fsS --max-time 5 http://127.0.0.1:3000/health >/dev/null 2>&1 && break
            sleep 5
          done
          curl -fsS --max-time 5 http://127.0.0.1:3000/health >/dev/null 2>&1 \
            || { echo '::error::The gateway never became healthy.'; docker logs waha | tail -50; exit 1; }
          echo "Gateway is up."

      - name: Open the tunnel
        id: tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          NGROK_DOMAIN: ${{ secrets.NGROK_DOMAIN }}
        run: |
          if [ -n "$NGROK_AUTHTOKEN" ] && [ -n "$NGROK_DOMAIN" ]; then
            # A reserved domain, so the address never changes between runs.
            curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz \
              | tar -xz -C /usr/local/bin ngrok
            ngrok config add-authtoken "$NGROK_AUTHTOKEN"
            nohup ngrok http 3000 --domain "$NGROK_DOMAIN" --log stdout > tunnel.log 2>&1 &
            sleep 10
            grep -q 'started tunnel' tunnel.log \
              || { echo '::error::The ngrok tunnel did not start.'; tail -30 tunnel.log; exit 1; }
            URL="https://$NGROK_DOMAIN"
          else
            # No account needed. The address changes on every run, which is why
            # the next step tells the platform where the gateway went.
            curl -sSL -o cloudflared \
              https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
            chmod +x cloudflared && sudo mv cloudflared /usr/local/bin/
            nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3000 > tunnel.log 2>&1 &
            URL=""
            for i in $(seq 1 30); do
              URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1 || true)
              [ -n "$URL" ] && break
              sleep 5
            done
            [ -n "$URL" ] \
              || { echo '::error::The tunnel did not report an address.'; tail -30 tunnel.log; exit 1; }
          fi

          for i in $(seq 1 20); do
            curl -fsS --max-time 10 "$URL/health" >/dev/null 2>&1 && break
            sleep 5
          done
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Reachable at $URL"

      - name: Tell the platform where the gateway is
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          URL: ${{ steps.tunnel.outputs.url }}
        run: |
          code=$(curl -s -o response.json -w '%{http_code}' -X POST \
            -H "x-admin-token: $ADMIN_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"url\":\"$URL\"}" \
            "$SITE_URL/api/admin/gateway")
          if [ "$code" != "200" ]; then
            echo "::error::The platform rejected the address (HTTP $code)."
            cat response.json || true
            exit 1
          fi
          echo "The platform will send through $URL"

      - name: Hold the gateway open
        run: |
          # Stay alive until shortly before GitHub would kill the job, checking
          # the gateway as we go. The next scheduled run takes over from here.
          END=$(( $(date +%s) + 340 * 60 ))
          FAILS=0
          while [ "$(date +%s)" -lt "$END" ]; do
            if curl -fsS --max-time 10 http://127.0.0.1:3000/health >/dev/null 2>&1; then
              FAILS=0
            else
              FAILS=$(( FAILS + 1 ))
              echo "health check failed ($FAILS)"
              if [ "$FAILS" -ge 3 ]; then
                echo '::warning::Gateway unhealthy three times; restarting it.'
                docker restart waha || true
                FAILS=0
              fi
            fi
            sleep 60
          done
          echo "Handing over to the next run."

      - name: Save the WhatsApp session
        # Runs even when an earlier step failed, so a pairing is never lost.
        if: always()
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SESSION_PASSPHRASE: ${{ secrets.SESSION_PASSPHRASE }}
        run: |
          docker stop waha >/dev/null 2>&1 || true
          sudo chown -R "$(id -u):$(id -g)" sessions || true
          if [ -z "$(ls -A sessions 2>/dev/null)" ]; then
            echo "Nothing paired yet; nothing to save."
            exit 0
          fi
          tar -cz -C sessions . \
            | openssl enc -aes-256-cbc -pbkdf2 -pass env:SESSION_PASSPHRASE \
            | base64 -w0 > session.b64
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
            -H "x-admin-token: $ADMIN_TOKEN" \
            -H 'Content-Type: text/plain' \
            --data-binary "@session.b64" \
            "$SITE_URL/api/admin/gateway/session")
          rm -f session.b64
          case "$code" in
            200) echo "Session saved." ;;
            *) echo "::error::Could not save the session (HTTP $code). The next run will need a new QR." ; exit 1 ;;
          esac

      - name: What the gateway logged
        if: always()
        run: docker logs waha 2>&1 | tail -80 || true
